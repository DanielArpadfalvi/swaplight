name: Android

on:
  push:
  workflow_dispatch:
    inputs:
      play_upload:
        description: Upload the signed AAB to Google Play (needs PLAY_SERVICE_ACCOUNT_JSON)
        type: boolean
        default: false
      play_track:
        description: Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      play_status:
        description: Release status ("draft" until the app has been published once)
        type: choice
        options: [completed, draft]
        default: completed

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Build web assets
        env:
          # RevenueCat public SDK key (optional; without it the build has no working store).
          VITE_RC_API_KEY_ANDROID: ${{ secrets.VITE_RC_API_KEY_ANDROID }}
        run: npx vite build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk swaplight-debug-${{ env.VERSION_NAME }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: swaplight-debug-apk
          path: swaplight-debug-*.apk
      - name: Publish to "android-debug-latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-debug-latest --yes --cleanup-tag || true
          gh release create android-debug-latest swaplight-debug-*.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "Swaplight debug APK (${{ env.VERSION_NAME }})" \
            --notes "Automatic test build from ${{ github.ref_name }} @ ${{ github.sha }}. Not for store upload."
      # Overwrite "Mobile games/Swaplight.apk" on Google Drive in place (same file id, same link).
      # The file is owned by the Drive account and shared with the service account as editor,
      # so the upload counts against the owner's quota (service accounts have none of their own).
      - name: Check Google Drive secret
        id: gdrive
        env:
          GDRIVE_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GDRIVE_JSON" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::GDRIVE_SERVICE_ACCOUNT_JSON missing - skipping the Google Drive upload (see docs/RELEASE.md)."
          fi
      - id: gdrive-auth
        if: steps.gdrive.outputs.enabled == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive
      - name: Upload APK to Google Drive
        if: steps.gdrive.outputs.enabled == 'true'
        env:
          TOKEN: ${{ steps.gdrive-auth.outputs.access_token }}
          FILE_ID: ${{ vars.GDRIVE_APK_FILE_ID || '1NAlTCgqpwzclLYG73372Oobum7Nkmfes' }}
        run: |
          APK=$(ls swaplight-debug-*.apk)
          curl --fail-with-body -sS -X PATCH \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@$APK" \
            "https://www.googleapis.com/upload/drive/v3/files/$FILE_ID?uploadType=media&supportsAllDrives=true&fields=id,size,modifiedTime"
          # Keep the build number visible in Drive's file details.
          curl --fail-with-body -sS -X PATCH \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"description\": \"$VERSION_NAME - ${{ github.ref_name }} @ ${GITHUB_SHA::7}\"}" \
            "https://www.googleapis.com/drive/v3/files/$FILE_ID?supportsAllDrives=true&fields=id"

  # Which release secrets exist? (Secrets cannot be used in job-level `if:` directly.)
  secrets-check:
    runs-on: ubuntu-latest
    outputs:
      signing: ${{ steps.check.outputs.signing }}
      play: ${{ steps.check.outputs.play }}
    steps:
      - id: check
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android release signing secrets missing - skipping the release AAB (see docs/RELEASE.md)."
          fi
          if [ -n "$PLAY_JSON" ]; then echo "play=true" >> "$GITHUB_OUTPUT"; else echo "play=false" >> "$GITHUB_OUTPUT"; fi

  # Signed release bundle for Google Play: manual runs, version tags (v*) and main.
  release-aab:
    needs: secrets-check
    if: >-
      needs.secrets-check.outputs.signing == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Play needs a strictly increasing versionCode: the workflow run number is.
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Build web assets
        env:
          # RevenueCat public SDK key. Without it the native app uses an "unavailable" store
          # (nothing can be bought; never the mock store), which must never ship: warn loudly.
          VITE_RC_API_KEY_ANDROID: ${{ secrets.VITE_RC_API_KEY_ANDROID }}
        run: |
          if [ -z "$VITE_RC_API_KEY_ANDROID" ]; then
            echo "::warning title=RevenueCat key missing::VITE_RC_API_KEY_ANDROID is not set - this build cannot sell the Full Version (store unavailable)."
          fi
          npx vite build
      - run: npx cap sync android
      - name: Decode upload keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          # Tags look like v1.2.3; Android wants 1.2.3.
          echo "VERSION_NAME=${VERSION_NAME#v}" >> "$GITHUB_ENV"
      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon
      - name: Verify signature
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | tee /dev/stderr | grep -q "jar verified"
          cp "$AAB" "swaplight-${VERSION_NAME}-${VERSION_CODE}.aab"
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: swaplight-release-aab
          path: swaplight-*.aab
          if-no-files-found: error
      - name: Upload to Google Play
        if: >-
          needs.secrets-check.outputs.play == 'true' &&
          ((github.event_name == 'workflow_dispatch' && inputs.play_upload) || startsWith(github.ref, 'refs/tags/v'))
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.arpadfalvi.swaplight
          releaseFiles: swaplight-*.aab
          track: ${{ inputs.play_track || 'internal' }}
          status: ${{ inputs.play_status || 'completed' }}
