name: iOS

on:
  push:
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload the signed build to TestFlight (needs the ASC_* / APPLE_TEAM_ID secrets)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build number must grow with every upload; marketing version comes from a v1.2.3 tag.
  BUILD_NUMBER: ${{ github.run_number }}
  MARKETING_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0' }}

jobs:
  # Unsigned simulator build: proves the native project compiles on every push.
  simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - name: Build web assets
        env:
          # RevenueCat public SDK key (optional; without it the build has no working store).
          VITE_RC_API_KEY_IOS: ${{ secrets.VITE_RC_API_KEY_IOS }}
        run: npx vite build
      - run: npx cap sync ios
      - name: Build for iOS Simulator
        run: |
          xcodebuild -version
          xcodebuild build \
            -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" -quiet \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${MARKETING_VERSION#v}" CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
      - name: Zip .app
        run: |
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app" \
            "swaplight-simulator-${BUILD_NUMBER}.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: swaplight-ios-simulator
          path: swaplight-simulator-*.zip
          if-no-files-found: error

  # Which release secrets exist? (Secrets cannot be used in job-level `if:` directly.)
  secrets-check:
    runs-on: ubuntu-latest
    outputs:
      signing: ${{ steps.check.outputs.signing }}
    steps:
      - id: check
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "::notice::App Store Connect secrets missing - skipping the signed iOS build (see docs/RELEASE.md)."
          fi

  # Signed App Store build (+ TestFlight upload). Signing is fully automatic: the archive is built
  # unsigned and `-exportArchive` signs it with an Xcode cloud-managed distribution certificate and
  # an auto-created App Store profile, authenticated by the App Store Connect API key. No .p12 or
  # provisioning profile secrets and no Mac needed. The same mechanism uploads to App Store Connect.
  release:
    needs: [simulator, secrets-check]
    if: >-
      needs.secrets-check.outputs.signing == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - name: Build web assets
        env:
          # RevenueCat public SDK key. Without it the native app uses an "unavailable" store
          # (nothing can be bought; never the mock store), which must never ship: warn loudly.
          VITE_RC_API_KEY_IOS: ${{ secrets.VITE_RC_API_KEY_IOS }}
        run: |
          if [ -z "$VITE_RC_API_KEY_IOS" ]; then
            echo "::warning title=RevenueCat key missing::VITE_RC_API_KEY_IOS is not set - this build cannot sell the Full Version (store unavailable)."
          fi
          npx vite build
      - run: npx cap sync ios
      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8" | base64 --decode > "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION=${MARKETING_VERSION#v}" >> "$GITHUB_ENV"
      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Swaplight.xcarchive" -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
      - name: Write export options
        run: |
          for DEST in export upload; do
            cat > "$RUNNER_TEMP/ExportOptions-$DEST.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DEST</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          done
      - name: Export signed IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Swaplight.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          cp "$RUNNER_TEMP"/export/*.ipa "swaplight-${MARKETING_VERSION}-${BUILD_NUMBER}.ipa"
      - uses: actions/upload-artifact@v5
        with:
          name: swaplight-ios-ipa
          path: swaplight-*.ipa
          if-no-files-found: error
      - name: Upload to App Store Connect (TestFlight)
        if: (github.event_name == 'workflow_dispatch' && inputs.testflight) || startsWith(github.ref, 'refs/tags/v')
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Swaplight.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-upload.plist" \
            -exportPath "$RUNNER_TEMP/upload" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
